name: wild-trader
# GO WILD - max leverage all-in experiment. PAPER ONLY.
# ONE decision run per day near the close. Deliberately a single driver: the main bot
# once had two runs race each other and place 5 orders instead of 3, buying on margin.
on:
  schedule:
    - cron: '45 19 * * 1-5'    # 3:45 PM ET Mon-Fri (19:45 UTC during EDT) - decision run
  workflow_dispatch: {}
concurrency:
  group: wild-trader-single
  cancel-in-progress: true
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write            # needed to commit the P&L scorecard back
    steps:
      - uses: actions/checkout@v4

      - name: Run GO WILD trader
        shell: pwsh
        env:
          WILD_APCA_API_BASE_URL:   ${{ secrets.WILD_APCA_API_BASE_URL }}
          WILD_APCA_API_KEY_ID:     ${{ secrets.WILD_APCA_API_KEY_ID }}
          WILD_APCA_API_SECRET_KEY: ${{ secrets.WILD_APCA_API_SECRET_KEY }}
        run: pwsh ./wild_trader.ps1

      - name: Record the scorecard
        if: always()             # record the damage even if the trader errored
        shell: pwsh
        env:
          WILD_APCA_API_BASE_URL:   ${{ secrets.WILD_APCA_API_BASE_URL }}
          WILD_APCA_API_KEY_ID:     ${{ secrets.WILD_APCA_API_KEY_ID }}
          WILD_APCA_API_SECRET_KEY: ${{ secrets.WILD_APCA_API_SECRET_KEY }}
        run: pwsh ./wild_record.ps1

      - name: Commit scorecard
        if: always()
        run: |
          git config user.name  "wild-bot"
          git config user.email "wild-bot@users.noreply.github.com"
          git add wild_pnl.csv || true
          git diff --staged --quiet || git commit -m "wild: daily scorecard $(date -u +%Y-%m-%d)"
          git push || true
